<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Food Recommendation System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 85%;
            max-width: 1000px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .full-width {
            grid-column: 1 / 3;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            cursor: pointer;
            background: #1f5f8b;
            color: white;
        }

        button:hover {
            background: #174b6d;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: 1;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Personalized Smart Food Recommendation System</h1>

    <p class="subtitle">
        Enter your details to receive a personalized diet recommendation
    </p>

    <form action="/predict" method="POST">

        <h2 class="section-title">Personal Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" min="1" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Weight (kg)</label>
                <input type="number" step="0.1" name="weight" required>
            </div>

            <div class="form-group">
                <label>Height (cm)</label>
                <input type="number" step="0.1" name="height" required>
            </div>

        </div>


        <h2 class="section-title">Health Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Disease Type</label>
                <select name="disease_type" required>
                    <option value="None">None</option>
                    <option value="Diabetes">Diabetes</option>
                    <option value="Obesity">Obesity</option>
                    <option value="Hypertension">Hypertension</option>
                    <option value="Anemia">Anemia</option>
                    <option value="High Cholesterol">High Cholesterol</option>
                    <option value="Thyroid">Thyroid</option>
                    <option value="Fatty Liver">Fatty Liver</option>
                    <option value="Kidney Stones">Kidney Stones</option>
                    <option value="Gastric Problems">Gastric Problems</option>
                    <option value="Healthy">Healthy</option>
                </select>
            </div>

            <div class="form-group">
                <label>Severity</label>
                <select name="severity" required>
                    <option value="Mild">Mild</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Severe">Severe</option>
                </select>
            </div>

            <div class="form-group">
                <label>Physical Activity Level</label>
                <select name="activity" required>
                    <option value="Low">Low</option>
                    <option value="Moderate">Moderate</option>
                    <option value="High">High</option>
                </select>
            </div>

            <div class="form-group">
                <label>Weekly Exercise Hours</label>
                <input type="number" step="0.1" name="exercise_hours" required>
            </div>

        </div>


        <h2 class="section-title">Health Measurements</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Daily Caloric Intake</label>
                <input type="number" name="calories" required>
            </div>

            <div class="form-group">
                <label>Cholesterol (mg/dL)</label>
                <input type="number" step="0.1" name="cholesterol" required>
            </div>

            <div class="form-group">
                <label>Blood Pressure (mmHg)</label>
                <input type="number" name="blood_pressure" required>
            </div>

            <div class="form-group">
                <label>Glucose (mg/dL)</label>
                <input type="number" step="0.1" name="glucose" required>
            </div>

            <div class="form-group">
                <label>Nutrient Imbalance Score</label>
                <input type="number" step="0.1"
                       name="nutrient_score"
                       required>
            </div>

            <div class="form-group">
                <label>Diet Plan Adherence</label>
                <input type="number"
                       step="0.01"
                       min="0"
                       max="1"
                       name="adherence"
                       placeholder="Example: 0.8"
                       required>
            </div>

        </div>


        <h2 class="section-title">Food Preferences</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Dietary Restrictions</label>
                <select name="restrictions" required>
                    <option value="None">None</option>
                    <option value="Vegetarian">Vegetarian</option>
                    <option value="Vegan">Vegan</option>
                    <option value="Gluten-Free">Gluten-Free</option>
                    <option value="Low-Sodium">Low-Sodium</option>
                </select>
            </div>

            <div class="form-group">
                <label>Allergies</label>
                <input type="text"
                       name="allergies"
                       placeholder="Example: None">
            </div>

            <div class="form-group">
                <label>Preferred Cuisine</label>
                <select name="cuisine" required>
                    <option value="Indian">Indian</option>
                    <option value="Chinese">Chinese</option>
                    <option value="Mediterranean">Mediterranean</option>
                    <option value="Western">Western</option>
                </select>
            </div>

        </div>


        <button type="submit">
            Get Personalized Recommendation
        </button>

    </form>

</div>

</body>
</html>
